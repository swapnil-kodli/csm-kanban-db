services:
  backend:
    build:
      context: ./backend
    # backend/.env holds the credentials (DATABASE_URL, Google OAuth) and is
    # gitignored. Optional on purpose: `required: false` means the stack still
    # comes up on a clean checkout with no .env, falling back to the SQLite
    # defaults below.
    env_file:
      - path: ./backend/.env
        required: false
    # No `environment:` block. Compose gives it precedence over `env_file`, so
    # naming DATABASE_URL there — as this file used to — silently beat whatever
    # backend/.env said and made the file's database setting dead text.
    # Precedence, verified with `docker compose config`, is:
    #   backend/.env  >  the image's ENV (Dockerfile)  >  the code default
    volumes:
      - signal-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Overridable, and empty by default on purpose. The deploy pipeline runs
      # a plain `docker build` and does not pass these through, and the slug
      # baked here can differ from the one the app is served under. With them
      # empty the frontend emits relative asset URLs and resolves its API base
      # from the live URL, so it works under any /p/{slug}/. Export BASE_PATH
      # and VITE_API_URL before `docker compose build` to pin them.
      args:
        BASE_PATH: ${BASE_PATH:-}
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  signal-data:
