services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/signal.db
      APP_VERSION: "1.0.0"
    volumes:
      - signal-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BASE_PATH: /p/signal-cs/
        VITE_API_URL: /p/signal-cs/
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  signal-data:
