server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 512;

    # The backend container is internal; this service is the public gateway.
    # Marketplace routes /p/{slug}/... here, so the injected prefix is stripped
    # with `rewrite` before proxying. proxy_pass is kept free of variables on
    # purpose: a variable in the upstream URL forces per-request DNS and would
    # need an explicit `resolver`, which fails closed with 502 without one.
    location ~ ^/p/[^/]+/api/ {
        rewrite ^/p/[^/]+(/api/.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Same API, reached without the prefix (local compose, or a stripping proxy).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable.
    location ~ ^/p/[^/]+/assets/(.*)$ {
        try_files /assets/$1 =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes served under the injected base path.
    location ~ ^/p/[^/]+/(.*)$ {
        try_files /$1 /$1/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
