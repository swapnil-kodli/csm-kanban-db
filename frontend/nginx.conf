server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A client that builds "/p/{slug}" + "/api" can emit a doubled slash.
    # Collapse it here so the request still routes (nginx default, made explicit
    # because the whole deployment hinges on it).
    merge_slashes on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 512;

    # The backend container is internal; this service is the public gateway.
    # Marketplace routes /p/{slug}/... here, so the injected prefix is stripped
    # before proxying.
    location ~ ^/p/[^/]+/api/ {
        rewrite ^/p/[^/]+(/api/.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Same API, reached without the prefix (local compose, or a stripping proxy).
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable.
    location ~ ^/p/[^/]+/assets/(.*)$ {
        try_files /assets/$1 =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # An /api path that reaches the SPA fallback would answer 200 text/html and
    # look like a working request. Fail loudly instead.
    location ~ ^(?:/p/[^/]+)?/api(?:/|$) {
        default_type application/json;
        return 502 '{"detail":"API route did not reach the backend"}';
    }

    # /p/{slug} redirects to /p/{slug}/, matching INSTRUCTIONS.md §2. Without
    # it, relative asset URLs on that page resolve to /p/assets/... — which the
    # SPA fallback below answers with 200 text/html, and the browser rejects the
    # module. Belt and braces with the router keeping the slash itself.
    location ~ ^/p/([^/]+)$ {
        return 301 /p/$1/$is_args$args;
    }

    # SPA routes served under the injected base path.
    location ~ ^/p/[^/]+/(.*)$ {
        try_files /$1 /$1/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
